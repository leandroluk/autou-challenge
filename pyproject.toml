[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "autou-challenge"
version = "0.1.0"
description = "Autou Challenge"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Leandro Santiago Gomes", email = "leandroluk@gmail.com" }]
keywords = [
  "autou",
  "challenge",
  "fastapi",
  "uvicorn",
  "nlp",
  "llm",
  "machine-learning",
]
classifiers = []
dependencies = [
  "fastapi>=0.111.0",
  "httpx>=0.28.1",
  "pydantic>=2.12.5",
  "pymupdf>=1.27.2",
  "pypdf>=6.9.1",
  "python-multipart>=0.0.22",
  "uvicorn[standard]>=0.29.0",
]

[project.urls]
Homepage = "https://github.com/leandroluk/autou-challenge"
Repository = "https://github.com/leandroluk/autou-challenge"
Issues = "https://github.com/leandroluk/autou-challenge/issues"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=1.3.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.15.2",
  "mypy>=1.19.1",
  "mkdocs-material>=9.7.3",
  "mkdocstrings[python]>=1.0.3",
  "zensical>=0.0.23",
  "mkdocstrings-python>=2.0.3",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
ignore = ["S101", "S105", "N802", "S608"]
select = ["E", "F", "I", "N", "UP", "ASYNC", "S"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["apps/api", "apps/e2e"]
exclude = ["test/", ".venv/"]
warn_return_any = true
warn_unused_configs = true
disallow_any_unimported = false
disallow_any_expr = false
disallow_any_decorated = false
disallow_any_explicit = false
disallow_any_generics = false
disallow_subclassing_any = false

[tool.coverage.run]
relative_files = true
omit = ["**/__main__.py", "**/__init__.py", "**/fake/**"]

[tool.uv.workspace]
members = ["apps/api", "apps/e2e"]

[tool.pyright]
include = ["apps/api", "apps/e2e"]
exclude = ["**/__pycache__", "**/.venv"]
pythonVersion = "3.13"
typeCheckingMode = "strict"
useLibraryCodeForTypes = true
reportImplicitStringConcatenation = false
reportUnknownMemberType = "information"
reportUnknownArgumentType = "information"
reportUnknownLambdaType = "information"
reportMissingTypeStubs = false
reportUnusedImport = "information"
reportUnusedVariable = "information"
reportUnknownVariableType = "information"
reportGeneralTypeIssues = "warning"
reportOptionalMemberAccess = "none"
reportAttributeAccessIssue = "none"
reportInvalidTypeVarUse = "none"
