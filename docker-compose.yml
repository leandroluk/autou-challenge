name: autou-challenge

networks:
  autou-challenge:
    name: autou-challenge

services:
  autou-challenge-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: autou-challenge-api
    restart: unless-stopped
    env_file: [ ./apps/api/.env.example ]
    networks: [ autou-challenge ]
    environment:
      - HTTP_HOST=0.0.0.0
      - HTTP_PORT=8000
    ports: [ 8000:8000 ]
    expose: [ 8000 ]

  autou-challenge-web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
      args:
        - ENVIRONMENT=production
        - NEXT_PUBLIC_API_URL=http://api.127.0.0.1.nip.io
    container_name: autou-challenge-web
    restart: unless-stopped
    env_file: [ ./apps/web/.env.example ]
    networks: [ autou-challenge ]
    ports: [ 3000:3000 ]
    expose: [ 3000 ]
    depends_on: [ autou-challenge-api ]

  autou-challenge-proxy:
    image: nginx:alpine
    container_name: autou-challenge-proxy
    restart: unless-stopped
    networks: [ autou-challenge ]
    ports: [ 80:80 ]
    volumes: [ ./.docker/nginx.conf:/etc/nginx/nginx.conf:ro ]
    depends_on: [ autou-challenge-api, autou-challenge-web ]